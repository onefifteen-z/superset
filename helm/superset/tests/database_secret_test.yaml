suite: database credentials from an existing Secret
templates:
  - deployment.yaml
  - deployment-worker.yaml
  - deployment-beat.yaml
  - deployment-flower.yaml
  - deployment-ws.yaml
  - deployment-mcp.yaml
  - init-job.yaml
  - secret-env.yaml
  - secret-superset-config.yaml
set:
  supersetCeleryBeat.enabled: true
  supersetCeleryFlower.enabled: true
  supersetWebsockets.enabled: true
  supersetMcp.enabled: true
tests:
  - it: injects DB_PASS via secretKeyRef into every workload (default key)
    templates: &workloads
      - deployment.yaml
      - deployment-worker.yaml
      - deployment-beat.yaml
      - deployment-flower.yaml
      - deployment-ws.yaml
      - deployment-mcp.yaml
      - init-job.yaml
    set:
      database.existingSecret: metadata-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: metadata-credentials
                key: password
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == 'DB_USER')]

  - it: honors custom keys and a templated Secret name
    templates: *workloads
    release:
      name: analytics
    set:
      database.existingSecret: '{{ .Release.Name }}-database'
      database.secretKeys.password: db-password
      database.secretKeys.user: db-user
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: analytics-database
                key: db-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USER
            valueFrom:
              secretKeyRef:
                name: analytics-database
                key: db-user

  - it: does not render DB_PASS into the generated env Secret
    template: secret-env.yaml
    set:
      database.existingSecret: metadata-credentials
      database.password: stub
    asserts:
      - notExists: {path: stringData.DB_PASS}
      - equal: {path: stringData.DB_USER, value: superset}
      - exists: {path: stringData.DB_HOST}
      - exists: {path: stringData.DB_PORT}

  - it: omits DB_USER from the generated env Secret when a user key is configured
    template: secret-env.yaml
    set:
      database.existingSecret: metadata-credentials
      database.secretKeys.user: username
    asserts:
      - notExists: {path: stringData.DB_PASS}
      - notExists: {path: stringData.DB_USER}

  - it: keeps the init job env block even without extraEnv
    template: init-job.yaml
    set:
      database.existingSecret: metadata-credentials
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 1
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: DB_PASS

  - it: still renders the SQLAlchemy URI from env vars
    template: secret-superset-config.yaml
    set:
      database.existingSecret: metadata-credentials
    asserts:
      - matchRegex:
          path: stringData["superset_config.py"]
          pattern: "env\\('DB_PASS', ''\\)"

  - it: is a no-op when database.uri is set
    templates: *workloads
    set:
      database.existingSecret: metadata-credentials
      database.uri: postgresql+psycopg2://u:p@h:5432/d
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == 'DB_PASS')]

  - it: keeps literal credentials when existingSecret is unset (regression)
    template: secret-env.yaml
    set:
      database.password: literal-pw
    asserts:
      - equal: {path: stringData.DB_PASS, value: literal-pw}
      - equal: {path: stringData.DB_USER, value: superset}

  - it: fails when the password key is emptied
    template: init-job.yaml
    set:
      database.existingSecret: metadata-credentials
      database.secretKeys.password: ""
    asserts:
      - failedTemplate:
          errorPattern: database.secretKeys.password must be set
